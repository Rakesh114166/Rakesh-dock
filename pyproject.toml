[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "colab_dock"
version = "1.0.0"
description = "A robust, automated molecular docking pipeline optimized for Google Colab."
readme = "README.md"
authors = [{ name = "Rakesh", email = "your.email@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics"
]
dependencies = [
    "vina>=1.2.5",
    "meeko>=0.4.0",
    "pandas>=2.0.0"
]
requires-python = ">=3.8"
